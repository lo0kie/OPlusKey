name: build

on:
  push:
    branches: [master, main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # 打 tag 时创建 Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Android SDK + NDK（build:daemon 交叉编译用）
      - uses: android-actions/setup-android@v4
      - name: Install NDK
        run: sdkmanager --install "ndk;28.2.13676358" > /dev/null
      - name: Export NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build daemon
        run: pnpm build:daemon

      - name: Build WebUI & pack module
        run: pnpm pack:module

      # Artifact 本身会被 GitHub 打包一次，上传解压后的模块文件，
      # 下载得到的就是可直接刷入的 zip，不会出现 zip 套 zip
      - name: Unpack module zip
        run: |
          mkdir -p dist/artifact
          for z in dist/*.zip; do unzip -q -o "$z" -d dist/artifact; done

      - uses: actions/upload-artifact@v7
        with:
          name: OPlusKey
          path: dist/artifact

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
