# OPlusKey Remapper
# 注意：这个文件不会被打进模块包，只是仓库里的参考模板。
# 设备上实际生效的是 /data/adb/OPlusKey/config.conf（daemon 首次启动时生成）。
# 动作格式: none=屏蔽 | native=保留原始按键 | passthrough=判定后转发一次按键
#          keyevent:KEYCODE | shell:命令 | intent:ACTION | app:包名/Activity | 其他任意 shell 命令

double_click_ms=300
long_repeat_interval_ms=300
vibrate=0

# 侧键 (Plus Key)
plus_enabled=0
plus_long_press_ms=500
plus_single=native
plus_double=none
plus_long=none
plus_long_repeat=0

# 电源键 (注意: 长按连发会屏蔽系统自带的电源长按菜单)
power_enabled=0
power_long_press_ms=500
power_single=native
power_double=none
power_long=none
power_long_repeat=0

# 音量+
vol_up_enabled=0
vol_up_long_press_ms=500
vol_up_single=native
vol_up_double=none
vol_up_long=none
vol_up_long_repeat=0

# 音量-
vol_down_enabled=0
vol_down_long_press_ms=500
vol_down_single=native
vol_down_double=none
vol_down_long=none
vol_down_long_repeat=0
